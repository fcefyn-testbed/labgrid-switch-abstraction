[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "labgrid-switch-abstraction"
version = "0.1.0"
description = "Vendor-agnostic switch VLAN abstraction for Labgrid-based automation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "netmiko",
    "pyyaml",
]

[project.optional-dependencies]
# Ruff is pinned to a minor range: newer releases enable additional lint
# rules by default and would break CI without any code change on our side.
# Bump this pin deliberately when we opt into the new rules.
dev = ["pytest", "ruff>=0.14,<0.15"]

[project.scripts]
switch-vlan = "switch_abstraction.vlan_manager:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
